# Render Blueprint: deploys the Gradio demo from the Dockerfile.
# Render injects PORT; app.py binds to it.
services:
  - type: web
    name: insurancebot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # No shared OPENROUTER_API_KEY: visitors paste their own key in the UI.
      # (Add one in the Render dashboard if you want a fallback that spends your credit.)
      - key: MODEL
        value: openai/gpt-5.6-luna
